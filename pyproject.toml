[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xact-tb"
version = "0.1.0"
description = "Documented reconstruction of XACT-TB (hybrid CNN + Swin features + SVM for TB chest X-ray screening). Research software, not a medical device."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "bm3d>=4.0.3",
  "matplotlib>=3.8",
  "PyYAML>=6",
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "fvcore>=0.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
kaggle = ["kaggle>=1.6"]

[project.scripts]
xact-tb = "xact_tb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs timm-sized models or bm3d on larger images"]

[tool.coverage.run]
source = ["xact_tb"]
omit = ["src/xact_tb/cli.py"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # frozen-dataclass config defaults are immutable

[tool.ruff.lint.per-file-ignores]
"src/xact_tb/reporting/paper_reference.py" = ["E501"]
"src/xact_tb/cli.py" = ["E702"]
"tests/**" = ["E702", "E501"]
